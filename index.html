<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/434616d8e1.js" crossorigin="anonymous"></script>
</head>
<body>
    <button id="firstBtn">
        <span>Add</span>
        <span><i class="fa-solid fa-plus"></i></span>
    </button>
    <p id="modal"></p>
    <form action="" id="form">
       <div>
          <label for="">Note Title</label>
          <input type="text" placeholder="note title" id="noteTitle">
       </div>
       <div>
            <label for="">Note</label>
            <textarea placeholder="Input your note." id="noteBody"></textarea>
       </div>
       <input type="submit" value="ADD NOTE" id="submitBtn">
    </form>
    
    <div id="container">
       
    </div>

    <script src="script.js"></script>
</body>
</html>
